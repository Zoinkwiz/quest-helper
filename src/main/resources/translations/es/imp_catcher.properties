Bring Mizgog his beads=Lleva las beads a Mizgog
Collect one of each bead. You can kill imps for these beads, or buy them on the Grand Exchange.=Consigue una bead de cada color. Puedes matar imps para conseguir estas beads, o comprarlas en el Grand Exchange.
Head to the Wizards' Tower and climb up the staircase with the required beads.=Ve a la Wizards' Tower y sube la escalera con las beads requeridas.
Talk to Wizard Mizgog with the required beads to finish the quest.=Habla con Wizard Mizgog con las beads requeridas para terminar la misión.
Imps (level 2) if you plan on collecting the beads yourself=Imps (nivel 2) si planeas conseguir las beads tú mismo
