# Spanish translations for Pirate's Treasure.
# Key = the exact English string in the code; value = translation.
# Never translate quest names, game entity names (items, NPCs, locations) or dialog choices.
You can get another one from Redbeard Frank=Puedes conseguir otro de Redbeard Frank
Talk to Redbeard Frank in Port Sarim.=Habla con Redbeard Frank en Port Sarim.
Read the Pirate message.=Lee el Pirate message.
Climb up the stairs in The Blue Moon Inn in Varrock.=Sube las escaleras de The Blue Moon Inn en Varrock.
Open the chest by using the key on it.=Abre el chest usando la key encima.
Dig in the middle of the cross in Falador Park, and kill the Gardener (level 4) who appears. Once killed, dig again.=Cava en el centro de la cross en Falador Park, y mata al Gardener (nivel 4) que aparece. Tras matarlo, cava de nuevo.
Kill the Gardener (level 4).=Mata al Gardener (nivel 4).
Gardener (level 4)=Gardener (nivel 4)
Talk to Redbeard Frank=Habla con Redbeard Frank
Discover the treasure=Descubre el treasure
Please open Pirate Treasure's Quest Journal to sync the current quest state.=Abre el Quest Journal de Pirate Treasure para sincronizar el estado actual de la misión.
Talk to one of the Seamen on the docks in Port Sarim to go to Musa Point.=Habla con uno de los Seamen en los muelles de Port Sarim para ir a Musa Point.
Talk to Zembo in the Karamja Wines, Spirits and Beers bar. Buy one Karamjan rum.=Habla con Zembo en el bar Karamja Wines, Spirits and Beers. Compra un Karamjan rum.
Pick 10 bananas nearby, and then talk to Luthas about working for him.=Coge 10 bananas cerca, y luego habla con Luthas sobre trabajar para él.
Put the Karamjan rum into the crate.=Pon el Karamjan rum en el crate.
Right-click fill the rest of the crate with bananas, then talk to Luthas.=Haz right-click en fill para llenar el crate con bananas, luego habla con Luthas.
Talk to Luthas and tell him you finished filling the crate.=Habla con Luthas y dile que terminaste de llenar el crate.
Head back to Port Sarim. Pay the Customs Officer to sail there.=Regresa a Port Sarim. Paga al Customs Officer para zarpar hacia allá.
Grab the white apron from the Fishing Shop.=Coge el white apron de la Fishing Shop.
Search the crate in the back room of the Port Sarim food shop. Make sure you're wearing your white apron.=Busca el crate en la trastienda de la food shop de Port Sarim. Asegúrate de llevar tu white apron.
Bring the Karamjan rum to Redbeard Frank in Port Sarim.=Lleva el Karamjan rum a Redbeard Frank en Port Sarim.
Rum smuggling=Contrabando de rum
Back to Port Sarim=De vuelta a Port Sarim
A teleport to Varrock=Un teleport a Varrock
A teleport to Falador=Un teleport a Falador
