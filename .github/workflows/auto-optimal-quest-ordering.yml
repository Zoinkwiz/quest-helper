name: Update optimal quest orderings from Wiki

on:
  pull_request_target:
    branches:
      - master
    types: closed
  push:
    branches:
      - ci/auto-optimal-quest-order

permissions:
  contents: write

concurrency:
  group: update-optimal-quest-orders
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event_name == 'push' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    env:
      TARGET_BRANCH: ${{ github.event_name == 'push' && github.ref_name || 'master' }}
    steps:
      - name: Check out Quest Helper
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0

      - name: Check out osrs-wiki-parser
        uses: actions/checkout@v4
        with:
          repository: pajlads/osrs-wiki-parser
          ref: master
          path: 'workspace'
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --directory workspace --frozen --no-dev

      - name: Refresh Wiki data
        run: uv run --directory workspace --no-sync data/update.py

      - name: Update optimal quest list
        run: |
          OPTIMAL_QUEST_LIST=$(uv run --directory workspace --no-sync main.py quests-by-optimal-order)
          printf '\t\t%s\n' "$OPTIMAL_QUEST_LIST" |
            sed -i '/questList = ImmutableList\.of(/,/^[[:space:]]*);/{
              /questList =/r /dev/stdin
              /questList =/b
              /^[[:space:]]*);/!d
            }' src/main/java/com/questhelper/panel/questorders/OptimalQuestGuide.java

      - name: Update optimal ironman quest list
        run: |
          OPTIMAL_IRONMAN_QUEST_LIST=$(uv run --directory workspace --no-sync main.py ironman-quests-by-optimal-order)
          printf '\t\t%s\n' "$OPTIMAL_IRONMAN_QUEST_LIST" |
            sed -i '/questList = ImmutableList\.of(/,/^[[:space:]]*);/{
              /questList =/r /dev/stdin
              /questList =/b
              /^[[:space:]]*);/!d
            }' src/main/java/com/questhelper/panel/questorders/IronmanOptimalQuestGuide.java

      - name: Update optimal ironman quest list
        run: |
          BY_RELEASE_QUEST_LIST=$(uv run --directory workspace --no-sync main.py quests-by-release-date)
          printf '\t\t%s\n' "$BY_RELEASE_QUEST_LIST" |
            sed -i '/questList = ImmutableList\.of(/,/^[[:space:]]*);/{
              /questList =/r /dev/stdin
              /questList =/b
              /^[[:space:]]*);/!d
            }' src/main/java/com/questhelper/panel/questorders/ReleaseDate.java

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "11"

      - name: Validate and commit changes
        run: |
          git add -- \
            src/main/java/com/questhelper/panel/questorders/OptimalQuestGuide.java \
            src/main/java/com/questhelper/panel/questorders/IronmanOptimalQuestGuide.java \
            src/main/java/com/questhelper/panel/questorders/ReleaseDate.java
          
          if git diff --cached --quiet; then
            echo "No quest ordering changes."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git commit -m "Update quest orderings from Wiki"
          git pull --rebase origin "$TARGET_BRANCH"
          ./gradlew compileJava --no-daemon
          git push origin "HEAD:$TARGET_BRANCH"
