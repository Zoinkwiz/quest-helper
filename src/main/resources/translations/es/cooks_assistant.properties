# Spanish translations for Cook's Assistant.
# Key = the exact English string in the code; value = translation.
# Never translate quest names, game entity names (items, NPCs, locations) or dialog choices.
Necessary if you do not have a pot / bucket=Necesario si no tienes una Pot / Bucket
Purchase a bucket from the Lumbridge General Store.=Compra un Bucket en la General Store de Lumbridge.
Purchase a pot from the Lumbridge General Store.=Compra una Pot en la General Store de Lumbridge.
Grab an egg from the farm north of Lumbridge.=Coge un Egg de la granja al norte de Lumbridge.
Pick some wheat north of Lumbridge.=Recoge un poco de Wheat al norte de Lumbridge.
Climb up the ladder in the Mill north of Lumbridge to the top floor.=Sube la escalera del Mill al norte de Lumbridge hasta el piso superior.
Fill the hopper with your grain.=Llena la Hopper con tu Grain.
Operate the hopper controls.=Opera los controles de la Hopper.
Climb down the ladder in the Mill to the ground floor.=Baja la escalera del Mill hasta la planta baja.
Collect the flour in the bin.=Recoge el Flour del contenedor.
Milk the dairy cow north of Lumbridge.=Ordeña la vaca lechera al norte de Lumbridge.
Give the Cook in Lumbridge Castle's kitchen the required items to finish the quest.=Entrega al Cook en la cocina del Castillo de Lumbridge los items requeridos para terminar la misión.
Permission to use The Cook's range.=Permiso para usar la range del Cook.
Starting off=Empezando
Getting the Egg=Consiguiendo el Egg
Getting the Flour=Consiguiendo el Flour
Getting the Milk=Consiguiendo el Milk
Finishing up=Finalizando
